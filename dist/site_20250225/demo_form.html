<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>註冊表單Demo</title>
        <link rel="stylesheet" href="../assets/css/reset.css" />
        <link rel="stylesheet" href="assets/css/demo_form.css" />
    </head>
    <body>
        <div class="container">
            <h1>註冊表單</h1>

            <form action="" class="register-form" method="get">
                <div class="form-group">
                    <label for="user-name">姓名:</label>
                    <input
                        type="text"
                        name="user-name"
                        id="user-name"
                        placeholder="請輸入姓名"
                    />
                </div>
                <div class="form-group">
                    <label for="user-email">信箱:</label>
                    <input
                        type="email"
                        name="user-email"
                        id="user-email"
                        placeholder="請輸入email"
                    />
                </div>
                <button type="submit">送出</button>
            </form>
            <div id="success-message" class="success-message">
                註冊成功！感謝您的提交。
            </div>
        </div>
    </body>
    <script src="assets/js/demo_form.js"></script>
</html>
