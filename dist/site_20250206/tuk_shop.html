<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Bootstrap TUK</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
    </head>
    <body>
        <div class="container">
            <div class="alert alert-info">Grid System Demo</div>
            <hr />
            <div class="row">
                <!-- breakpoints預設為12格 -->
                <!-- col-6: 不論裝置寬度多少，每塊col都會佔6格 -->
                <!-- col-lg-4: lg為寬度992px，即寬度大於992px時，每塊col都會佔4格 -->
                <!-- col-xl-3: lg為寬度1200px，即寬度大於1200px時，每塊col都會佔3格 -->
                <div class="col-6 col-lg-4 col-xl-3">
                    <div class="card">
                        <img
                            src="./assets/images/1.jpg"
                            alt=""
                            class="card-img-top"
                        />
                        <div class="card-body">
                            <h5 class="card-title">Product 1</h5>
                            <p class="card-text">
                                Lorem ipsum dolor sit amet consectetur
                                adipisicing elit.
                            </p>
                        </div>
                        <div class="card-footer">
                            <button class="btn btn-primary">Add to Cart</button>
                        </div>
                    </div>
                </div>
                <div class="col-6 col-lg-4 col-xl-3">
                    <div class="card">
                        <img
                            src="./assets/images/2.png"
                            alt=""
                            class="card-img-top"
                        />

                                Lorem ipsum dolor sit amet consectetur
                                adipisicing elit.
                            </p>
                        </div>
                        <div class="card-footer">
                            <button class="btn btn-primary">Add to Cart</button>
                        </div>
                    </div>
                </div>
                <div class="col-6 col-lg-4 col-xl-3">
                    <div class="card">
                        <img
                            src="./assets/images/3.jpg"
                            alt=""
                            class="card-img-top"
                        />
                        <div class="card-body">
                            <h5 class="card-title">Product 3</h5>
                            <p class="card-text">
                                Lorem ipsum dolor sit amet consectetur
                                adipisicing elit.
                            </p>
                        </div>
                        <div class="card-footer">
                            <button class="btn btn-primary">Add to Cart</button>
                        </div>
                    </div>
                </div>
                <div class="col-6 col-lg-4 col-xl-3">
                    <div class="card">
                        <img
                            src="./assets/images/4.jpg"
                            alt=""
                            class="card-img-top"
                        />

                            <h5 class="card-title">Product 4</h5>

                                adipisicing elit.
                            </p>
                        </div>
                        <div class="card-footer">
                            <button class="btn btn-primary">Add to Cart</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</html>
