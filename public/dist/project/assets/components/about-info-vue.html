<link rel="stylesheet" href="assets/css/about-info.css" />
<div class="about-info">
    <div class="container" id="about-info-app">
        <template v-for="item in items">
            <h2 v-if="item.title_tag === 'h2'">{{ item.title}}</h2>
            <h3 v-if="item.title_tag === 'h3'">{{ item.title}}</h3>
            <!-- 不會轉譯 html tag -->
            <div class="info-block" v-html="item.content"></div>
            <!-- 會轉譯 html tag -->
            <!-- <div class="info-block">{{ item.content }}</div> -->
        </template>
    </div>
</div>
